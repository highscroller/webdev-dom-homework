<!doctype html>
<html>
    <head>
        <title>Проект "Комменты"</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="assets/css/styles.css" />
        <link rel="icon" href="assets/img/favicon.ico" />
    </head>

    <body>
        <div class="container">
            <ul class="comments" id="comments">
                <!-- здесь комментарии -->
            </ul>
            <div class="add-form">
                <input
                    type="text"
                    class="add-form-name"
                    placeholder="Введите ваше имя"
                    id="name"
                />
                <div class="add-form-reply" id="reply-to" hidden></div>
                <textarea
                    type="textarea"
                    class="add-form-text"
                    placeholder="Введите ваш коментарий"
                    rows="4"
                    id="comment"
                ></textarea>
                <div class="add-form-row">
                    <button class="add-form-button" id="submit">
                        Написать
                    </button>
                </div>
            </div>
        </div>
    </body>

    <script type="module" src="assets/js/index.js"></script>
</html>
