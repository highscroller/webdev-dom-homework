      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          id="name"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
          id="comment"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button" id="submit">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";

    const nameInput = document.getElementById("name");
    const commentInput = document.getElementById("comment");
    const addButton = document.getElementById("submit");
    const commentsList = document.querySelector(".comments");

    let userName = "";
    let userComment = "";

    const comments = [
      {
        name: "Глеб Фокин",
        comment: "Это будет первый комментарий на этой странице",
        date: "12.02.2022 12:18:00",
        likes: 3,
        isLiked: false
      },
      {
        name: "Варвара Н.",
        comment: "Мне нравится как оформлена эта страница! ❤",
        date: "13.02.2022 19:22:00",
        likes: 75,
        isLiked: true
      }
    ];

    function initLikeButtons() {
      const likeButtons = document.querySelectorAll(".like-button");

      likeButtons.forEach((likeButton, index) => {
        likeButton.addEventListener("click", () => {
          comments[index].isLiked = !comments[index].isLiked;

          if (comments[index].isLiked) {
            comments[index].likes += 1;
          } else {
            comments[index].likes -= 1;
          }

          renderComments();
        });
      });
    }

    function renderComments() {
      commentsList.innerHTML = comments
        .map((comment) => {
          const likeClass = comment.isLiked ? "-active-like" : "";

          return `
            <li class="comment">
              <div class="comment-header">
                <div>${comment.name}</div>
                <div>${comment.date}</div>
              </div>
              <div class="comment-body">
                <div class="comment-text">
                  ${comment.comment}
                </div>
              </div>
              <div class="comment-footer">
                <div class="likes">
                  <span class="likes-counter">${comment.likes}</span>
                  <button class="like-button ${likeClass}"></button>
                </div>
              </div>
            </li>
          `;
        })
        .join("");

      initLikeButtons();
    }

    renderComments();

    nameInput.addEventListener("input", () => {
      userName = nameInput.value;
      nameInput.classList.remove("error");
    });

    commentInput.addEventListener("input", () => {
      userComment = commentInput.value;
      commentInput.classList.remove("error");
    });


    addButton.addEventListener("click", () => {
      if (userName.trim() === "") {
        nameInput.classList.add("error");
        return;
      }

      if (userComment.trim() === "") {
        commentInput.classList.add("error");
        return;
      }

      const dateNow = new Date();

      comments.push({
        name: userName,
        comment: userComment,
        date: dateNow.toLocaleString(),
        likes: 0,
        isLiked: false
      });

      nameInput.value = "";
      commentInput.value = "";
      userName = "";
      userComment = "";

      renderComments();
    });

    
  </script>
